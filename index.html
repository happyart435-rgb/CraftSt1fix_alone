<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gamebooster WebApp</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- TON Connect UI SDK -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: #0d0e12; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-x: hidden; }

    /* Верхняя шапка */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .stats-group { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 14px; }
    .online-count { color: #ffd700; display: flex; align-items: center; gap: 4px; }
    .balance-btn { background: #1e232d; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 4px 12px 4px 6px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .diamond-icon { width: 22px; height: 22px; background: #2ab8ff; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .plus-btn { width: 22px; height: 22px; background: #ffcc00; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }

    /* Карусель кейсов */
    .carousel { display: flex; gap: 10px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
    .carousel::-webkit-scrollbar { display: none; }
    .item-card { min-width: 80px; height: 95px; background: #251c24; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: 2px solid transparent; }
    .item-card.active { border-color: #ffcc00; box-shadow: 0 0 12px rgba(255, 204, 0, 0.4); }
    .item-badge { background: rgba(0, 0, 0, 0.5); border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; }
    .item-percent { background: #11a84e; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; }

    /* Баннер */
    .banner { margin: 10px 16px; background: linear-gradient(90deg, #3d1b11 0%, #1a1b20 100%); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .banner-title { font-size: 15px; font-weight: 800; color: #fff; }

    /* Центральная рулетка */
    .main-circle-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 25px 0; }
    .wheel-outer { width: 230px; height: 230px; border-radius: 50%; border: 8px solid #1a1d24; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    .wheel-center { text-align: center; }
    .chance-value { font-size: 34px; font-weight: 900; }
    .chance-label { font-size: 12px; color: #7a7e85; margin-top: 2px; }
    .arrow-indicator { position: absolute; bottom: -12px; color: #ffcc00; font-size: 20px; }

    /* Нижнее меню */
    .bottom-nav { background: rgba(20, 22, 28, 0.9); backdrop-filter: blur(10px); padding: 10px 20px 20px 20px; display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 24px; border-top-right-radius: 24px; }
    .nav-item { background: #232730; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
    .nav-item.main { width: 60px; height: 60px; background: #2b303c; color: #ffcc00; border: 2px solid #ffcc00; }

    /* Модальное окно */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: none; align-items: flex-end; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #181a20; width: 100%; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px 34px 20px; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-close { background: #2a2e39; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #aaa; }

    /* Кнопка TON Connect внутри модалки */
    #ton-connect-button { display: flex; justify-content: center; margin-bottom: 15px; }
    .amount-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #2a2e39; background: #0d0e12; color: #fff; font-size: 16px; outline: none; text-align: center; }
    .btn-action { width: 100%; background: #2ab8ff; color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="stats-group">
      <div class="online-count">👥 120</div>
      <div class="user-coins">⚡ 54,852</div>
    </div>
    <div class="balance-btn" onclick="openDepositModal()">
      <div class="diamond-icon">💎</div>
      <span id="userBalance">0.2</span>
      <div class="plus-btn">+</div>
    </div>
  </div>

  <!-- Карусель -->
  <div class="carousel">
    <div class="item-card active">
      <div class="item-badge">💎 420</div>
      <div style="font-size:24px">🧢</div>
      <div class="item-percent">58%</div>
    </div>
    <div class="item-card">
      <div class="item-badge">💎 5.63</div>
      <div style="font-size:24px">🐶</div>
      <div class="item-percent">60%</div>
    </div>
    <div class="item-card">
      <div class="item-badge">💎 5.69</div>
      <div style="font-size:24px">🍬</div>
      <div class="item-percent">73%</div>
    </div>
  </div>

  <!-- Баннер -->
  <div class="banner">
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size: 28px;">🪖</span>
      <div class="banner-title">Бесплатный NFT Кейс</div>
    </div>
    <span style="color:#666; cursor:pointer;">✕</span>
  </div>

  <!-- Рулетка -->
  <div class="main-circle-container">
    <div class="wheel-outer">
      <div class="wheel-center">
        <div class="chance-value">0.00%</div>
        <div class="chance-label">Средний шанс</div>
      </div>
      <div class="arrow-indicator">▲</div>
    </div>
  </div>

  <!-- Нижнее меню -->
  <div class="bottom-nav">
    <div class="nav-item">🎁</div>
    <div class="nav-item">🏆</div>
    <div class="nav-item main">▲</div>
    <div class="nav-item">👤</div>
    <div class="nav-item" onclick="openDepositModal()">💎</div>
  </div>

  <!-- Модальное окно пополнения TON -->
  <div class="modal-overlay" id="depositModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Пополнение TON</div>
        <div class="modal-close" onclick="closeDepositModal()">✕</div>
      </div>

      <!-- Кнопка подключения кошелька (TON Connect UI) -->
      <div id="ton-connect-button"></div>

      <input type="number" id="tonAmount" class="amount-input" placeholder="Сумма TON (например: 1)" step="0.1" min="0.1" value="1">
      <button class="btn-action" onclick="sendTonPayment()">Оплатить TON</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Инициализация TON Connect
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://aftt1fixalone.vercel.app/tonconnect-manifest.json', // Замените на ваш домен
      buttonRootId: 'ton-connect-button'
    });

    function openDepositModal() {
      document.getElementById('depositModal').classList.add('active');
    }

    function closeDepositModal() {
      document.getElementById('depositModal').classList.remove('active');
    }

    // Логика реального платежа
    async function sendTonPayment() {
      if (!tonConnectUI.connected) {
        alert("Пожалуйста, подключите кошелек через TON Connect!");
        return;
      }

      const amount = document.getElementById('tonAmount').value;
      if (!amount || amount <= 0) {
        alert("Введите корректную сумму!");
        return;
      }

      const nanoTon = Math.floor(parseFloat(amount) * 1e9).toString();
      const MERCHANT_ADDRESS = "EQD...YOUR_WALLET_ADDRESS_HERE..."; // Укажите ваш адрес кошелька

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600,
        messages: [
          {
            address: MERCHANT_ADDRESS,
            amount: nanoTon,
            payload: btoa(tg?.initDataUnsafe?.user?.id || "user_id") // Передаем ID юзера для бэкенда
          }
        ]
      };

      try {
        const result = await tonConnectUI.sendTransaction(transaction);
        alert("Транзакция успешно отправлена!");
        closeDepositModal();
        
        // Отправляем данные на ваш Python-сервер для проверки
        await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ boc: result.boc, amount: amount })
        });
      } catch (error) {
        console.error(error);
        alert("Ошибка при отправке транзакции.");
      }
    }
  </script>
</body>
</html>
